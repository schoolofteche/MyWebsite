<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Nairobi School</title>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>
     <!-- Navigation section -->
     <nav>
        <a href="">Home</a>
        <a href="">About</a>
        <a href="">Courses</a>
        <a href="">Contact</a>
     </nav>
     <!-- Hero section -->
      <section class="hero-contact">
        <h1>Contact Us</h1>
        <p>Lorem ipsum dolor, sit amet consectetur adipisicing elit. Aut amet optio fuga ex, odit cupiditate.</p>
      </section>

      <section class="main-section">
            <div class="info">
                <img src="https://plus.unsplash.com/premium_photo-1663106423058-c5242333348c?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" alt="">
                <h2>Get in Touch</h2>
                <p>Email: info@mmm.com</p>
                <p>Phone: 0711111111</p>
                <p>Location: Nairobi, Kenya</p>
            </div>
            <div class="form">
                <form action="">
                    <label for="fullname">Full Name</label>
                    <input type="text" id="fullname" name="fullname">

                    <label for="email">Email</label>
                    <input type="email" id="email" name="email">

                    <label for="message">Message</label>
                    <textarea name="message" id="message"></textarea>

                    <button type="submit">Send Message</button>
                </form>
            </div>
      </section>
</body>
</html>
